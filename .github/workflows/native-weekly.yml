name: Native weekly

# Full-matrix native build + smoke without publishing anything. PR CI only
# covers linux-x86_64, and the release/snapshot smoke matrices only run at
# ship time — this catches a target-specific breakage in between, instead of
# discovering it while trying to cut a release.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-arm64
          - os: macOS-15-intel
            target: macos-x86_64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # Static linking on Linux requires zlib headers
      - name: Install native-image prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libz-dev

      - name: Build native image
        run: |
          export CELLAR_VERSION="0.1.0-SNAPSHOT-$(git rev-parse --short HEAD)"
          ./mill cli.nativeImage

      - name: Package artifact
        shell: bash
        run: |
          ARCHIVE="cellar-${{ matrix.target }}.tar.gz"
          mkdir staging
          cp out/cli/nativeImage.dest/native-executable staging/cellar
          tar -czf "${ARCHIVE}" -C staging .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

      # The smoke job runs without a checkout, so the script must arrive as an
      # artifact; upload it from a single matrix leg to avoid a name clash.
      - if: matrix.target == 'linux-x86_64'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: smoke
          path: smoke/
          include-hidden-files: true

  # Runs the packaged binary on a fresh runner that did not build it, exactly
  # as a user would get it. No checkout: image-build-time state (baked jrt
  # java.home, embedded resources) only breaks away from the build filesystem,
  # so anything the job takes from the repo or the build runner would mask it.
  smoke:
    name: Smoke (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-arm64
          - os: macOS-15-intel
            target: macos-x86_64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      # Build tools for the project-aware section; also puts a JVM on PATH,
      # which they need. The script unsets JAVA_HOME for its own lookups.
      - uses: VirtusLab/scala-cli-setup@main
        with:
          jvm: temurin:17
          apps: sbt

      - name: Download packaged binary
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ matrix.target }}

      - name: Download smoke suite
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: smoke
          path: smoke/

      - name: Unpack
        shell: bash
        run: |
          mkdir -p staging
          tar -xzf "cellar-${{ matrix.target }}.tar.gz" -C staging

      - name: Run the binary
        shell: bash
        run: bash smoke/native-smoke.sh "$PWD/staging/cellar"
