name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: VirtusLab/scala-cli-setup@main
        with:
          jvm: temurin:17
          apps: sbt

      - name: Warm up scala-cli Bloop server
        run: echo 'object W' > /tmp/W.scala && scala-cli compile /tmp/W.scala

      - run: ./mill _.test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: ./mill _.fix --check

  native-build:
    name: Build native image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # Static linking on Linux requires zlib headers
      - name: Install native-image prerequisites
        run: sudo apt-get install -y libz-dev

      - name: Build native image
        run: |
          export CELLAR_VERSION="0.1.0-SNAPSHOT-$(git rev-parse --short HEAD)"
          ./mill cli.nativeImage

      # The smoke job asserts against these instead of a third-party coordinate,
      # so CI does not depend on a Maven Central artifact staying put.
      - name: Publish fixtures to local m2
        run: ./mill publishFixtures

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-binary
          path: out/cli/nativeImage.dest/native-executable

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: smoke
          path: smoke/
          include-hidden-files: true

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fixtures-m2
          path: ~/.m2/repository/

  # Deliberately no checkout and a runner that did not build the binary:
  # image-build-time state (baked jrt java.home, embedded resources) only
  # breaks away from the build filesystem, so build and run must not share one.
  native-smoke:
    name: Native smoke
    needs: native-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # Build tools for the project-aware section; also puts a JVM on PATH,
      # which they need. The script unsets JAVA_HOME for its own lookups.
      - uses: VirtusLab/scala-cli-setup@main
        with:
          jvm: temurin:17
          apps: sbt

      - name: Download binary
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-binary

      - name: Download smoke suite
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: smoke
          path: smoke/

      - name: Download fixture m2 repository
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: fixtures-m2
          path: m2repo/

      - name: Run the binary
        run: |
          chmod +x native-executable
          bash smoke/native-smoke.sh ./native-executable "file://$PWD/m2repo"

  nix:
    name: Validate flake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@526118121621777ccd86f79b04685a9319637641 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - run: nix flake show
