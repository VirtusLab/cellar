name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3, without v prefix)'
        required: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-arm64
          - os: macOS-15-intel
            target: macos-x86_64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # Static linking on Linux requires zlib headers
      - name: Install native-image prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libz-dev

      - name: Build native image
        run: ./mill cli.nativeImage
        env:
          CELLAR_VERSION: v${{ inputs.version }}

      - name: Package artifact
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          ARCHIVE="cellar-${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir staging
          cp out/cli/nativeImage.dest/native-executable staging/cellar
          cp README.md staging/
          tar -czf "${ARCHIVE}" -C staging .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  jar:
    name: Build JAR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build assembly JAR
        run: ./mill cli.assembly
        env:
          CELLAR_VERSION: v${{ inputs.version }}

      - name: Rename JAR
        run: |
          VERSION="${{ inputs.version }}"
          JAR="cellar-${VERSION}.jar"
          cp out/cli/assembly.dest/out.jar "${JAR}"
          echo "JAR=${JAR}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: jar
          path: ${{ env.JAR }}

      # The smoke job runs without a checkout, so the suite must arrive as an
      # artifact. Uploaded here rather than in `build` to avoid a name clash
      # across the build matrix.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: smoke
          path: smoke/
          include-hidden-files: true

  # Runs the packaged binary on a fresh runner that did not build it, exactly
  # as a user would get it. No checkout: image-build-time state (baked jrt
  # java.home, embedded resources) only breaks away from the build filesystem,
  # so anything the job takes from the repo or the build runner would mask it.
  smoke:
    name: Smoke (${{ matrix.target }})
    needs: [build, jar]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-arm64
          - os: macOS-15-intel
            target: macos-x86_64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      # Build tools for the project-aware section; also puts a JVM on PATH,
      # which they need. The script unsets JAVA_HOME for its own lookups.
      - uses: VirtusLab/scala-cli-setup@main
        with:
          jvm: temurin:17
          apps: sbt

      - name: Download packaged binary
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ matrix.target }}

      - name: Download smoke suite
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: smoke
          path: smoke/

      - name: Unpack
        shell: bash
        run: |
          mkdir -p staging
          tar -xzf "cellar-${{ inputs.version }}-${{ matrix.target }}.tar.gz" -C staging

      - name: Run the binary
        shell: bash
        run: bash smoke/native-smoke.sh "$PWD/staging/cellar"

  publish-maven:
    name: Publish lib + profilingRuntime + cli to Maven Central
    runs-on: ubuntu-latest
    # Gate the upload on native-binary + JAR builds: a Sonatype release is
    # immutable, so we must not publish a version whose GitHub Release assets
    # (referenced by the coursier descriptor's prebuiltBinaries) won't exist —
    # and on the smoke job, so a binary that cannot run on a machine other
    # than its build runner is never published.
    needs: [build, jar, smoke]
    # No-op unless `maven-central` env is configured in repo settings with the
    # SONATYPE_* / PGP_* secrets moved onto it (see RELEASING.md).
    environment: maven-central
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish to Maven Central
        run: ./mill lib.publishSonatypeCentral + profilingRuntime.publishSonatypeCentral + cli.publishSonatypeCentral
        env:
          CELLAR_VERSION: v${{ inputs.version }}
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.PGP_SECRET }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

  release:
    name: Publish Release
    needs: [build, jar, publish-maven]
    runs-on: ubuntu-latest
    # OIDC token for cosign keyless signing; write access for release publishing
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Download all artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.jar > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign checksums (keyless OIDC)
        working-directory: artifacts
        run: cosign sign-blob --yes checksums.txt --bundle checksums.txt.bundle

      - name: Update flake.nix
        run: |
          VERSION="${{ inputs.version }}"

          # Convert hex sha256 to Nix SRI format (sha256-<base64>)
          sri_hash() {
            echo -n "$1" | xxd -r -p | base64 | tr -d '\n' | sed 's/^/sha256-/'
          }

          LINUX_X86=$(sri_hash "$(grep "linux-x86_64.tar.gz" artifacts/checksums.txt | awk '{print $1}')")
          LINUX_ARM=$(sri_hash "$(grep "linux-aarch64.tar.gz" artifacts/checksums.txt | awk '{print $1}')")
          MACOS_ARM=$(sri_hash "$(grep "macos-arm64.tar.gz" artifacts/checksums.txt | awk '{print $1}')")
          MACOS_X86=$(sri_hash "$(grep "macos-x86_64.tar.gz" artifacts/checksums.txt | awk '{print $1}')")

          sed -i "0,/version = \".*\";/s|version = \".*\";|version = \"${VERSION}\";|" flake.nix
          sed -i "/linux-x86_64/{n;s|hash = \".*\";|hash = \"${LINUX_X86}\";|}" flake.nix
          sed -i "/linux-aarch64/{n;s|hash = \".*\";|hash = \"${LINUX_ARM}\";|}" flake.nix
          sed -i "/macos-x86_64/{n;s|hash = \".*\";|hash = \"${MACOS_X86}\";|}" flake.nix
          sed -i "/macos-arm64/{n;s|hash = \".*\";|hash = \"${MACOS_ARM}\";|}" flake.nix

      - name: Commit, tag, and push
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git diff --cached --quiet && echo "No flake changes" && exit 0
          git commit -m "Update flake.nix to ${VERSION}"
          git push origin main
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        # generate_release_notes lets GitHub pick the previous release itself,
        # and it picks the newest snapshot prerelease when one exists, dropping
        # every change between the last stable release and that snapshot (bit
        # v0.1.0-M10). Pin previous_tag_name to the latest stable release.
        run: |
          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases" \
            -q '[.[] | select(.prerelease or .draft | not)][0].tag_name')
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="v${{ inputs.version }}" \
            ${PREV_TAG:+-f previous_tag_name="$PREV_TAG"} \
            -q .body > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ inputs.version }}
          files: artifacts/*
          body_path: release-notes.md
