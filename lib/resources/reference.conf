maven {
  # Extra Maven repository URLs used by every external command, in addition to
  # Coursier's defaults (Maven Central, Ivy local). CLI -r/--repository values
  # are appended to this list.
  repositories = []
}

mill {
  # When running mill, which binary to invoke
  binary = "./mill"
  binary = ${?CELLAR_MILL_BINARY}
}

sbt {
  # When running sbt, which binary to invoke (sbt or sbtn)
  binary = "sbt"
  binary = ${?CELLAR_SBT_BINARY}
  # Extra arguments to pass to sbt, for example to run in client mode (--client)
  # Several arguments can be passed by separating them with spaces
  extra-args = ""
  extra-args = ${?CELLAR_SBT_EXTRA_ARGS}
}

starvation-checks {
  # cats-effect's CPU starvation checker emits warnings when the compute pool
  # is blocked. cellar shells out to mill/sbt for classpath extraction, which
  # routinely trips the default checker with noise that is not actionable for
  # a short-lived CLI. Disabled by default; set to true if debugging.
  enabled = false
  enabled = ${?CELLAR_STARVATION_CHECKS_ENABLED}
}

profiling {
  enabled = false
  enabled = ${?CELLAR_PROFILING_ENABLED}
  # Pyroscope is a local-dev-only feature: the production telemetry stack does
  # not accept profiles. The default points at the dev/ docker-compose stack;
  # override CELLAR_PYROSCOPE_ENDPOINT for any other target.
  pyroscope-endpoint = "http://localhost:4040"
  pyroscope-endpoint = ${?CELLAR_PYROSCOPE_ENDPOINT}
}

otel {
  enabled = false
  enabled = ${?CELLAR_OTEL_ENABLED}
  endpoint = "http://178.104.189.163:4318/v1/traces"
  endpoint = ${?CELLAR_OTEL_ENDPOINT}
}
