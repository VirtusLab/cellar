server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Mirrors the deploy stack: span_metrics with the same dimension allowlist
# get pushed to Prometheus so dashboards behave the same locally.
metrics_generator:
  registry:
    external_labels:
      source: cellar
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      dimensions:
        - command.name
        - command.success
        - error.category
        - error.type
        - cellar.version
        - os.type
        - build.tool

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics]
