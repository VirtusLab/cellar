services:
  ingest:
    image: nginx:1.30-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "4318:4318"   # public OTLP HTTP, rate-limited per-IP
    depends_on: [otel-collector]
    restart: unless-stopped
    networks:
      - cellar-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    restart: unless-stopped
    networks:
      - cellar-network

  tempo:
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo-config.yml"]
    volumes:
      - ./tempo-config.yml:/etc/tempo-config.yml:ro
      - tempo-data:/var/tempo
    depends_on: [prometheus]
    restart: unless-stopped
    networks:
      - cellar-network

  # Stores pre-aggregated span metrics (RED + duration histograms) shipped from
  # Tempo's metrics_generator. By construction the data has no installation.id
  # label, so retention is unbounded.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=10y"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - cellar-network

  grafana:
    image: grafana/grafana:13.0.1
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      # Localhost defaults; CI/Besom overrides at deploy time.
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000/}
      - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN:-localhost}
      # Admin credentials are injected by the deploy job (GitHub Actions → shell env).
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:?GF_ADMIN_USER must be set}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set}
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      # Single-tenant: only the admin account exists. Lock everything else down.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_DISABLE_SIGNOUT_MENU=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Admin
    depends_on: [tempo]
    restart: unless-stopped
    networks:
      - cellar-network

networks:
  cellar-network:

volumes:
  tempo-data:
  grafana-data:
  prometheus-data:
