worker_processes 1;
events { worker_connections 1024; }

http {
  # Per-IP rate limit is the hard ceiling (rotating IPs costs money).
  limit_req_zone $binary_remote_addr zone=traces:10m rate=10r/s;

  # Per-installation fairness layer for NAT'd users (one corporate IP,
  # many real installs). The CLI sends X-Installation-Id from
  # TracingRuntime; requests without the header bypass this zone (nginx
  # skips empty keys) but still hit the per-IP zone above. Header is
  # client-rotatable, so this is fairness, not security.
  limit_req_zone $http_x_installation_id zone=installs:10m rate=5r/s;

  limit_req_status 429;

  # The TLS terminator (Hetzner LB / Caddy) sits in front of this nginx,
  # so trust XFF from it for $binary_remote_addr resolution. We do NOT
  # propagate the client IP further: see proxy_set_header below and the
  # scrubbed access_log format.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # No client IPs in logs (GDPR; not needed for telemetry). Just enough
  # to diagnose rate-limit hits and 5xx.
  log_format scrubbed '[$time_local] "$request" $status $body_bytes_sent rt=$request_time';
  access_log /var/log/nginx/access.log scrubbed;

  upstream collector {
    server otel-collector:4318;
  }

  server {
    listen 4318;
    server_name _;

    # ~3 spans per CLI invocation; 1m is ~100× headroom for OTLP/HTTP/JSON.
    client_max_body_size 1m;

    proxy_set_header Host $host;
    # Strip client-IP signal before it reaches the collector. The
    # ingestion path is anonymous by construction; downstream pipelines
    # must not see, log, or label by IP. Empty value omits the header.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";

    location = /v1/traces {
      limit_req zone=traces   burst=30 nodelay;
      limit_req zone=installs burst=30 nodelay;
      proxy_pass http://collector;
    }

    # Everything else (metrics, logs, root, anything) is closed.
    # access_log off so scanner traffic doesn't fill the log.
    location / {
      access_log off;
      return 404;
    }
  }
}
