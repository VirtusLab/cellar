worker_processes 1;
events { worker_connections 1024; }

http {
  # Per-IP rate limit. Cellar is a CLI: each invocation sends a handful
  # of spans. Generous for normal use, tight on abuse.
  limit_req_zone $binary_remote_addr zone=traces:10m rate=10r/s;
  limit_req_status 429;

  # The only thing reaching nginx is the LB, so trust XFF from it.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream collector {
    server otel-collector:4318;
  }

  server {
    listen 4318;
    server_name _;

    client_max_body_size 4m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /v1/traces {
      limit_req zone=traces burst=30 nodelay;
      proxy_pass http://collector;
    }

    # Everything else (metrics, logs, root, anything) is closed.
    location / {
      return 404;
    }
  }
}
