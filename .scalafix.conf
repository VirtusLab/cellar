rules = [
  OrganizeImports
  DisableSyntax
]

OrganizeImports {
  targetDialect = Scala3
  groupedImports = Merge
  # Scala 3 has no SemanticDB-based unused-import info here; `-Wunused:all` already reports them.
  removeUnused = false
}

DisableSyntax.regex = [
  {
    id = javaNioFile
    pattern = "java\\.nio\\.file\\.(\\{[^}]*)?\\b(Files|Paths|Path)\\b"
    message = "Use fs2.io.file instead: fs2.io.file.Path for paths, Files[IO] for file IO. For unavoidable JDK interop, wrap the block in `// scalafix:off DisableSyntax.javaNioFile` / `// scalafix:on DisableSyntax.javaNioFile` with a comment saying why."
  }
  {
    id = javaIoFile
    pattern = "java\\.io\\.File\\b"
    message = "Use fs2.io.file.Path instead of java.io.File."
  }
]
